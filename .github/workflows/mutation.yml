---

name: Mutation Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [3.x]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: error_reporting=E_ALL
          coverage: xdebug

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # The Infection Phar can't run Testo yet: the bundled adapter's mutant bootstrap calls the
      # unscoped `\Infection\StreamWrapper\IncludeInterceptor`, while the Phar ships it as
      # `Infected\Infection\StreamWrapper\IncludeInterceptor`. Infection requires PHP >= 8.3,
      # so it is installed here rather than in require-dev (the package supports PHP 8.2).
      - name: 📥 Install Infection
        run: |
          composer config allow-plugins.infection/extension-installer true
          composer require --dev --no-interaction --no-progress --with-all-dependencies infection/infection testo/bridge-infection

      - name: 🧬 Run mutation testing
        run: vendor/bin/infection --threads=max --logger-github --show-mutations=0 --min-msi=85
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
